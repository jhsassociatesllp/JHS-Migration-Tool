name: Deploy to production

# Every push to main deploys — this project has a single environment (production only,
# port 8050), unlike vendor/CRM's staging+production setup. Manual re-run from the
# Actions tab is also available (workflow_dispatch), for redeploying without a new
# commit (e.g. after fixing something directly on the VM).
#
# Fully self-bootstrapping: if ~/apps/migration-tool-production doesn't exist yet on the
# VM, this clones it and writes .env from the secrets below on its own — no manual SSH
# setup needed beyond the deploy key and firewall/network access already in place (same
# VM, same key as vendor/CRM). Once the directory exists, later runs just pull and
# redeploy in place (deploy.sh's normal job).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          APP_PORT: "8050"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: REPO_URL,DB_PASSWORD,APP_PORT
          script: |
            set -e
            DIR=~/apps/migration-tool-production

            if [ ! -d "$DIR/.git" ]; then
              echo "First run — cloning into $DIR"
              mkdir -p ~/apps
              git clone -b main "$REPO_URL" "$DIR"
            fi

            cd "$DIR"

            if [ ! -f .env ]; then
              echo "No .env yet — writing one from GitHub secrets"
              cat > .env <<ENVEOF
            DB_USER=migrationtool
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=migrationtool
            APP_PORT=${APP_PORT}
            ENVEOF
              chmod 600 .env
            fi

            chmod +x deploy.sh
            ./deploy.sh
